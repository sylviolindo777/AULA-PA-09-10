<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato | StepUp Calçados</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="contato" data-base="../">
  <header id="site-header"></header>

  <main class="container secao">
    <h1 class="secao__titulo">Fale com a gente</h1>
    <div class="contato">
      <form id="form-contato" class="form" novalidate>
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" placeholder="Seu nome">
        <span class="erro" data-erro="nome"></span>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="voce@email.com">
        <span class="erro" data-erro="email"></span>

        <label for="mensagem">Mensagem</label>
        <textarea id="mensagem" name="mensagem" rows="5" placeholder="Como podemos ajudar?"></textarea>
        <span class="erro" data-erro="mensagem"></span>

        <button class="btn btn--primario" type="submit">Enviar mensagem</button>
        <p class="msg msg--ok" id="msg-contato"></p>
      </form>

      <div class="contato__info">
        <h2>Atendimento</h2>
        <p>Segunda a sexta, das 9h às 18h.</p>
        <p>📧 contato@stepup.exemplo</p>
        <p>📱 (11) 90000-0000</p>
        <p>📍 Rua dos Calçados, 123 — São Paulo/SP</p>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="../js/produtos.js"></script>
  <script src="../js/carrinho.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
